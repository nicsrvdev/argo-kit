name: Build and Push Image

on:
  push:
    branches: [main]
    paths:
      - "index.js"
      - "package.json"
      - "Dockerfile"
      - ".dockerignore"
      - "gosrc/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  go-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build niccore
        working-directory: gosrc
        run: go build -tags with_quic -trimpath -ldflags "-s -w" -o /tmp/niccore ./niccore
      - name: Build niclink
        working-directory: gosrc
        run: go build -trimpath -ldflags "-s -w" -o /tmp/niclink ./niclink
      - name: Smoke check
        run: |
          /tmp/niccore --help 2>&1 | head -5
          /tmp/niclink --help 2>&1 | head -5
          /tmp/niclink run --help 2>&1 | head -5

  docker:
    needs: go-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: node --check index.js

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
